<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Font Imports -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Inter:wght@300&amp;display=swap');
      .script-font { font-family: 'Great Vibes', cursive; }
      .tagline-font { font-family: 'Inter', sans-serif; }
    </style>
  </defs>

  <!-- Background Warm Canvas -->
  <rect width="100%" height="100%" fill="#F7F5F0" rx="8"/>

  <!-- Minimal Icon in Warm Olive -->
  <g transform="translate(25, 30)">
    <!-- Thin Handle forming '1' -->
    <path d="M 22 22 C 22 10, 38 10, 38 22" fill="none" stroke="#6B705C" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Lightweight Bag Contour -->
    <path d="M 15 22 C 15 22, 17 55, 18 55 C 19 55, 41 55, 42 55 C 43 55, 45 22, 45 22 Z" fill="none" stroke="#6B705C" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- Main Brand Name -->
  <text x="85" y="62" class="script-font" font-size="42" fill="#2C302E">
    The Shop<tspan fill="#6B705C">One</tspan>
  </text>

  <!-- Updated Tagline -->
  <text x="88" y="85" class="tagline-font" font-size="9" font-weight="300" fill="#B5A895" letter-spacing="4">
    CURATED ESSENTIALS
  </text>
</svg>
