<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 75" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Inter:wght@400&amp;display=swap');
      .script-font { font-family: 'Great Vibes', cursive; }
      .tagline-font { font-family: 'Inter', sans-serif; }
    </style>
  </defs>

  <!-- Minimal Icon in Warm Olive -->
  <g transform="translate(5, 8)">
    <!-- Handle forming '1' -->
    <path d="M 24 22 C 24 8, 42 8, 42 22" fill="none" stroke="#6B705C" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Lightweight Bag Contour -->
    <path d="M 16 22 C 16 22, 18 58, 20 58 C 21 58, 45 58, 46 58 C 47 58, 50 22, 50 22 Z" fill="none" stroke="#6B705C" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Main Brand Name -->
  <text x="68" y="46" class="script-font" font-size="44" fill="#2C302E">
    The Shop<tspan fill="#6B705C">One</tspan>
  </text>

  <!-- Tagline -->
  <text x="70" y="65" class="tagline-font" font-size="9" font-weight="400" fill="#8C857B" letter-spacing="3.5">
    CURATED ESSENTIALS
  </text>
</svg>
